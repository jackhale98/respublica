name: Apply errata review

# Records corrections made on the site's errata page (/errata/): words the
# scans could not settle, read off the page image by a maintainer. The page
# opens a GitHub issue titled "Errata review" whose body lists one
# correction per line (correct REF INDEX "was" "now"). This job runs only
# for issues opened by someone with write access to this repository: it
# records each correction under that person's GitHub login with
# `python -m tools.errata apply` (corrections/{work}.jsonl, updating link
# quotes that contain the word), re-runs the importers that produce the
# corrected works, which apply them (only those, with only the raw files they
# read: importers/outputs.json, decision 65), checks that nothing else
# changed, runs the checks, commits to main (which Cloudflare builds and
# deploys, and where CI runs the full `make verify`),
# and comments on and closes the issue. It uses only the workflow's own
# GITHUB_TOKEN; no secrets. See docs/ocr.md, "Correcting words", and
# docs/decisions.md 48.

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: errata-review
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      startsWith(github.event.issue.title, 'Errata review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      REVIEWER: ${{ github.event.issue.user.login }}
    steps:
      - name: Check that the author can write to the repository
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "$REVIEWER has $perm access" ;;
            *) gh issue comment "$ISSUE" --repo "$REPO" --body "Only people with write access to this repository can record corrections; nothing was changed."
               gh issue close "$ISSUE" --repo "$REPO" --reason "not planned"
               exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Record the corrections
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/errata.txt"
          python -m tools.errata apply --reviewer "$REVIEWER" --text "$RUNNER_TEMP/errata.txt" > "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"
      # Only the importers that produce the corrected works are re-run, with only
      # the raw files they read (importers/outputs.json; decision 65). The full
      # check runs on the push to main.
      - id: scope
        run: |
          works=$(python -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["works"]))' "$RUNNER_TEMP/result.json")
          python -m tools.scope --works "$works" | tee -a "$GITHUB_OUTPUT"
      - id: raw-keys
        run: python -m tools.fetch cache-keys >> "$GITHUB_OUTPUT"
      - if: contains(format(',{0},', steps.scope.outputs.families), ',usrep,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/loc-usrep-*.pdf
          key: raw-usrep-${{ steps.raw-keys.outputs.usrep }}
          restore-keys: raw-usrep-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',annals,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/ia-annals-*
          key: raw-annals-${{ steps.raw-keys.outputs.annals }}
          restore-keys: raw-annals-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',globe,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/ia-globe-*
          key: raw-globe-${{ steps.raw-keys.outputs.globe }}
          restore-keys: raw-globe-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',govinfo,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/govinfo-crecb-*
          key: raw-govinfo-${{ steps.raw-keys.outputs.govinfo }}
          restore-keys: raw-govinfo-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',iarecord,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/ia-record-*
          key: raw-iarecord-${{ steps.raw-keys.outputs.iarecord }}
          restore-keys: raw-iarecord-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',iadecl,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/ia-decl-*
          key: raw-iadecl-${{ steps.raw-keys.outputs.iadecl }}
          restore-keys: raw-iadecl-
      - if: contains(format(',{0},', steps.scope.outputs.families), ',road,')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources/raw/ia-road-*
          key: raw-road-${{ steps.raw-keys.outputs.road }}
          restore-keys: raw-road-
      - name: Re-run the importers the corrections touch
        env:
          IMPORTERS: ${{ steps.scope.outputs.importers }}
        run: |
          python -m tools.fetch --importers "$IMPORTERS"
          python -m importers --only "$IMPORTERS"
          python -m tools.scope --check --importers "$IMPORTERS" --allow corrections,links
          make test
          python -m tools.verify --importers "$IMPORTERS"
      - name: Commit and report
        run: |
          read -r recorded missing < <(python -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r["recorded"], len(r["not_found"]) + len(r["unreadable"]))' "$RUNNER_TEMP/result.json")
          if [ "$recorded" = "0" ]; then
            gh issue comment "$ISSUE" --repo "$REPO" --body "No listed word matched an uncertain word of its passage ($missing not found or unreadable: already corrected, or not copied in full); nothing was changed."
            gh issue close "$ISSUE" --repo "$REPO"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corrections texts cases links
          git commit -q -m "Errata review by $REVIEWER: $recorded word(s) corrected (#$ISSUE)"
          for i in 1 2 3; do git push origin HEAD:main && break; git pull --rebase -q origin main; done
          note=""
          if [ "$missing" != "0" ]; then note=" $missing listed word(s) were not found (already corrected, or not copied in full)."; fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "Recorded $recorded correction(s) as read by @$REVIEWER.$note The site is being redeployed."
          gh issue close "$ISSUE" --repo "$REPO"
